plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.3'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.sainti'
version = '0.0.1-SNAPSHOT'
description = 'mestemplate'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

test {
    useJUnitPlatform()
}

dependencies {
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    /* 모든 모듈이 사용하는 공통 Spring Boot 스타터 */
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    /* Validation */
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    /* PostgreSQL Driver */
    runtimeOnly 'org.postgresql:postgresql'

    /* QueryDSL */
    implementation 'com.querydsl:querydsl-jpa:5.0.0:jakarta'
    annotationProcessor 'com.querydsl:querydsl-apt:5.0.0:jakarta'
    annotationProcessor "jakarta.annotation:jakarta.annotation-api"
    annotationProcessor "jakarta.persistence:jakarta.persistence-api"

    /* MapStruct */
    implementation 'org.mapstruct:mapstruct:1.5.5.Final'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'

    /* Swagger */
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'

    /* Test */
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

/* -parameters 플래그: Spring MVC @PathVariable 등 파라미터 이름 인식 */
tasks.withType(JavaCompile) {
    options.compilerArgs << '-parameters'
}

/* QueryDSL Q-클래스 생성 설정 (app 모듈 제외) */
if (project.name != 'mestemplate-app') {
    def querydslDir = layout.buildDirectory.dir("generated/querydsl")
    sourceSets {
        main.java.srcDirs += querydslDir.get().asFile
    }
    tasks.withType(JavaCompile) {
        options.generatedSourceOutputDirectory =
                querydslDir.get().asFile
    }
}