spring:
  application:
    name: mestemplate

  datasource:
    url: jdbc:postgresql://localhost:5432/mestemplate
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100

  jwt:
    secret: ${JWT_SECRET:mestemplate-jwt-secret-key-must-be-at-least-32-bytes-long}
    expiration-ms: 3600000 # 1시간

logging:
  level:
    org.hibernate.SQL: debug
    # bind 파라미터 로깅(값 노출)은 application-local.yaml에서 활성화
