services:
  postgres:
    image: postgres:16-alpine
    container_name: mestemplate-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: mestemplate
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mestemplate"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
